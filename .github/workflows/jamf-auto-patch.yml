name: Jamf Apple Auto Patch

on:
  # Scheduled execution - runs daily at 9:00 AM UTC
  schedule:
    - cron: '0 9 * * *'

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Log level'
        required: false
        default: 'INFO'
        type: choice
        options:
          - DEBUG
          - INFO
          - WARNING
          - ERROR
      dry_run:
        description: 'Dry run (log only, no updates)'
        required: false
        default: false
        type: boolean

  # Trigger on push to main (for testing workflow changes)
  push:
    branches:
      - main
    paths:
      - 'jamf-apple-auto-patch.sh'
      - '.github/workflows/jamf-auto-patch.yml'

permissions:
  contents: read
  issues: write  # For creating issues on failure

jobs:
  run-auto-patch:
    name: Execute Jamf Auto-Patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate script exists
        run: |
          if [ ! -f "jamf-apple-auto-patch.sh" ]; then
            echo "Error: jamf-apple-auto-patch.sh not found"
            exit 1
          fi
          echo "✅ Script found"

      - name: Install dependencies
        run: |
          echo "Installing required tools..."
          sudo apt-get update -qq
          sudo apt-get install -y jq curl

          # Verify installations
          jq --version
          curl --version
          echo "✅ Dependencies installed"

      - name: Set up secrets file
        env:
          JAMF_CLIENT_ID: ${{ secrets.JAMF_CLIENT_ID }}
          JAMF_CLIENT_SECRET: ${{ secrets.JAMF_CLIENT_SECRET }}
          JAMF_URI: ${{ secrets.JAMF_URI }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "Creating secrets file..."
          cat > ~/.jamf_secrets << EOF
          LOCAL_JAMF_CLIENT_ID="$JAMF_CLIENT_ID"
          LOCAL_JAMF_CLIENT_SECRET="$JAMF_CLIENT_SECRET"
          LOCAL_JAMF_URI="$JAMF_URI"
          LOCAL_NVD_API_KEY="$NVD_API_KEY"
          EOF

          chmod 600 ~/.jamf_secrets
          echo "✅ Secrets file created and secured"

      - name: Validate secrets
        run: |
          echo "Validating required secrets are present..."
          source ~/.jamf_secrets

          if [ -z "$LOCAL_JAMF_CLIENT_ID" ]; then
            echo "❌ Error: JAMF_CLIENT_ID not set"
            exit 1
          fi

          if [ -z "$LOCAL_JAMF_CLIENT_SECRET" ]; then
            echo "❌ Error: JAMF_CLIENT_SECRET not set"
            exit 1
          fi

          if [ -z "$LOCAL_JAMF_URI" ]; then
            echo "❌ Error: JAMF_URI not set"
            exit 1
          fi

          echo "✅ Required secrets validated"
          echo "Jamf URI: $LOCAL_JAMF_URI"
          echo "Client ID: ${LOCAL_JAMF_CLIENT_ID:0:8}... (masked)"

          if [ -z "$LOCAL_NVD_API_KEY" ]; then
            echo "⚠️  Warning: NVD_API_KEY not set (CVE checks will be skipped)"
          else
            echo "NVD API Key: ${LOCAL_NVD_API_KEY:0:8}... (masked)"
          fi

      - name: Make script executable
        run: |
          chmod +x jamf-apple-auto-patch.sh
          echo "✅ Script is executable"

      - name: Run Auto-Patch Script
        id: run_script
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'INFO' }}
          # Override MDM parameters if needed (optional)
          ALPHA_GROUP_ID: ${{ vars.ALPHA_GROUP_ID || '315' }}
          BETA_GROUP_ID: ${{ vars.BETA_GROUP_ID || '235' }}
          GAMMA_GROUP_ID: ${{ vars.GAMMA_GROUP_ID || '326' }}
          RELEASE_GROUP_ID: ${{ vars.RELEASE_GROUP_ID || '203' }}
        run: |
          echo "=========================================="
          echo "Starting Jamf Apple Auto Patch"
          echo "Log Level: $LOG_LEVEL"
          echo "Dry Run: ${{ inputs.dry_run }}"
          echo "=========================================="
          echo ""

          # Create output directory for logs
          mkdir -p logs

          # Run the script with output capture
          if ./jamf-apple-auto-patch.sh 2>&1 | tee logs/execution.log; then
            echo "script_status=success" >> $GITHUB_OUTPUT
            echo "✅ Script completed successfully"
          else
            echo "script_status=failure" >> $GITHUB_OUTPUT
            echo "❌ Script failed with exit code $?"
            exit 1
          fi

      - name: Upload execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Parse execution summary
        if: always()
        run: |
          echo "## Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run ID:** ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Log Level:** ${{ inputs.log_level || 'INFO' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "logs/execution.log" ]; then
            # Extract key metrics from logs
            echo "### Key Events" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            grep -E "\[INFO\].*Processing Smart Group|Update plan created|Plan Status:" logs/execution.log | tail -20 || echo "No events found"
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Count plans created
            PLANS_CREATED=$(grep -c "Update plan created successfully" logs/execution.log || echo "0")
            echo "**Update Plans Created:** $PLANS_CREATED" >> $GITHUB_STEP_SUMMARY

            # Check for errors
            if grep -q "\[ERROR\]" logs/execution.log; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Errors Detected" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              grep "\[ERROR\]" logs/execution.log || echo "No errors found"
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi

            # Check for warnings
            if grep -q "\[WARNING\]" logs/execution.log; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### ⚠️ Warnings" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              grep "\[WARNING\]" logs/execution.log | head -10 || echo "No warnings found"
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Create issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read the last 50 lines of the log
            let logContent = 'No log available';
            try {
              const fullLog = fs.readFileSync('logs/execution.log', 'utf8');
              const lines = fullLog.split('\n');
              logContent = lines.slice(-50).join('\n');
            } catch (error) {
              logContent = `Error reading log: ${error.message}`;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Jamf Auto-Patch Failed - ${new Date().toISOString().split('T')[0]}`,
              body: `## Execution Failed

              The scheduled Jamf Auto-Patch execution failed.

              **Run Details:**
              - Run ID: [${context.runId}](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              - Run Number: ${context.runNumber}
              - Timestamp: ${new Date().toUTCString()}

              **Last 50 Log Lines:**
              \`\`\`
              ${logContent}
              \`\`\`

              **Action Required:**
              1. Review the [full execution logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              2. Check Jamf Pro API credentials and connectivity
              3. Verify Smart Group configurations
              4. Re-run the workflow if needed

              ---
              *This issue was automatically created by GitHub Actions*`,
              labels: ['auto-patch', 'failure', 'automation']
            });

      - name: Clean up secrets
        if: always()
        run: |
          if [ -f ~/.jamf_secrets ]; then
            shred -u ~/.jamf_secrets 2>/dev/null || rm -f ~/.jamf_secrets
            echo "✅ Secrets file securely removed"
          fi

  notify-success:
    name: Send Success Notification
    runs-on: ubuntu-latest
    needs: run-auto-patch
    if: success()

    steps:
      - name: Log success
        run: |
          echo "✅ Jamf Auto-Patch completed successfully"
          echo "Run ID: ${{ github.run_id }}"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      # Optional: Add Slack notification
